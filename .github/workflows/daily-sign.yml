name: WPS每日准时签到(每4小时)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sign:
    # 关键修复：ubuntu-latest 已滚动到 26.04，而当前 Playwright 版本不支持 26.04
    # 显式锁定 24.04，长期可用
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # 缓存 key 加入 runner 版本 + 锁文件哈希，避免换镜像/换 Playwright 版本后命中脏缓存
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-24.04-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-24.04-playwright-

      - name: 安装依赖
        run: npm install

      - name: 安装浏览器
        run: npx playwright install chromium --with-deps

      - name: 生成 state.json
        env:
          STATE_JSON: ${{ secrets.STATE_JSON }}
        run: echo "$STATE_JSON" > state.json

      - name: 开始签到
        run: node sign.js
