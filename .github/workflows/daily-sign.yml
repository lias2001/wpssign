name: WPS每日准时签到(7:00)

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 安装浏览器
        run: npx playwright install chromium --with-deps

      - name: 生成 state.json
        env:
          STATE_JSON: ${{ secrets.STATE_JSON }}
        run: echo "$STATE_JSON" > state.json

      - name: 开始签到
        run: node sign.js
