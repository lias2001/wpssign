name: WPS 每日签到（Cookie版）
on:
  schedule:
    - cron: '0 22 * * *' # UTC22:00 = 北京06:00
  workflow_dispatch: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 缓存：state.json（登录Cookie）+ pw_cache（浏览器缓存）
      - name: Cache auth & browser
        uses: actions/cache@v4
        with:
          path: |
            state.json
            pw_cache
          key: wps-cache-${{ github.sha }}
          restore-keys: wps-cache-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run sign（纯Cookie登录）
        run: node sign.js
