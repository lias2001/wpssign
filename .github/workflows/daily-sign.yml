name: WPS每日准时签到(7:00)

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 安装浏览器
        run: npx playwright install chromium --with-deps

      - name: 生成 state.json
        env:
          STATE_JSON: ${{ secrets.STATE_JSON }}
        run: echo "$STATE_JSON" > state.json

      - name: 开始签到
        run: node sign.js

      # ============新增：提交截图screen文件夹上传仓库============
      - name: 提交签到截图至仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screen/
          if git diff --cached --quiet; then
            echo "无新截图无需提交"
          else
            git commit -m "🤖自动签到截图:$(date '+%Y-%m-%d %H:%M')"
            git push
          fi
